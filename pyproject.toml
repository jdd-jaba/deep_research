[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research"
version = "0.1.0"
description = "Local deep research agent with Ollama, LangGraph, and DuckDuckGo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=1.0.0",
    "ddgs>=9.0",
    "httpx>=0.27.0",
    "trafilatura>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
deep-research = "deep_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
